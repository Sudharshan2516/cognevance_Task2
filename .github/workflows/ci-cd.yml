name: CI/CD Pipeline

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  ECR_REPOSITORY: task-tracker

jobs:
  test:
    name: Lint and test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - name: Lint (syntax check)
        run: npm run lint
      - name: Unit and API tests with coverage
        run: npm test | tee test-output.txt
      - name: Publish test summary
        if: always()
        run: |
          echo "### Test results (Node ${{ matrix.node }})" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "^# (tests|pass|fail)|all files" test-output.txt >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

  build:
    name: Build, scan and smoke-test image
    needs: test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          echo "tag=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          echo "date=$(date -u +%FT%TZ)" >> $GITHUB_OUTPUT
      - uses: docker/setup-buildx-action@v3
      - name: Build image (not pushed yet)
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: task-tracker:ci
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: task-tracker:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
      - name: Run container and smoke-test it
        run: |
          docker run -d --name ci-app -p 3000:3000 task-tracker:ci
          for i in $(seq 1 20); do curl -fs localhost:3000/health >/dev/null && break || sleep 1; done
          ./scripts/smoke-test.sh http://localhost:3000
          docker logs ci-app
          docker stop ci-app

  publish:
    name: Push image to Amazon ECR and deploy ECS
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
      - name: Create ECR repository
        working-directory: infra
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false \
            -target=aws_ecr_repository.app \
            -var="aws_region=${AWS_REGION}" \
            -var="github_repository=${GITHUB_REPOSITORY}" \
            -var="image_uri=bootstrap"
      - name: Login to ECR
        id: ecr
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          echo "registry=${REGISTRY}" >> "$GITHUB_OUTPUT"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REGISTRY"
      - name: Build and push image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE_URI="${REGISTRY}/${ECR_REPOSITORY}:${{ needs.build.outputs.tag }}"
          docker build \
            --build-arg APP_VERSION="${GITHUB_REF_NAME}" \
            --build-arg GIT_SHA="${GITHUB_SHA}" \
            --build-arg BUILD_DATE="$(date -u +%FT%TZ)" \
            -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
      - name: Apply AWS infrastructure
        working-directory: infra
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: |
          terraform apply -auto-approve -input=false \
            -var="aws_region=${AWS_REGION}" \
            -var="github_repository=${GITHUB_REPOSITORY}" \
            -var="image_uri=${IMAGE_URI}"
      - name: Wait for ECS service
        run: aws ecs wait services-stable --cluster "$ECR_REPOSITORY" --services "$ECR_REPOSITORY"
      - name: Publish deployment URL
        working-directory: infra
        run: |
          URL=$(terraform output -raw load_balancer_url)
          echo "### AWS deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`${{ steps.image.outputs.uri }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: ${URL}" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Verify ECS Fargate deployment
    needs: [build, publish]
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Verify deployment from outside
        run: ./scripts/smoke-test.sh "${{ secrets.AWS_APP_URL }}"
