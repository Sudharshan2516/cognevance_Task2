name: CI/CD Pipeline

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/task-tracker

jobs:
  # ---------- Stage 1: lint + test ----------
  test:
    name: Lint and test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - name: Lint (syntax check)
        run: npm run lint
      - name: Unit and API tests with coverage
        run: npm test | tee test-output.txt
      - name: Publish test summary
        if: always()
        run: |
          echo "### Test results (Node ${{ matrix.node }})" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "^# (tests|pass|fail)|all files" test-output.txt >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ---------- Stage 2: build image, scan, smoke test ----------
  build:
    name: Build, scan and smoke-test image
    needs: test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          echo "tag=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          echo "date=$(date -u +%FT%TZ)" >> $GITHUB_OUTPUT
      - uses: docker/setup-buildx-action@v3
      - name: Build image (not pushed yet)
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: task-tracker:ci
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: task-tracker:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"        # report only; set to 1 to block on findings
      - name: Run container and smoke-test it
        run: |
          docker run -d --name ci-app -p 3000:3000 task-tracker:ci
          for i in $(seq 1 20); do curl -fs localhost:3000/health >/dev/null && break || sleep 1; done
          ./scripts/smoke-test.sh http://localhost:3000
          docker logs ci-app
          docker stop ci-app

  # ---------- Stage 3: publish to Docker Hub ----------
  publish:
    name: Push image to Docker Hub
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: docker_meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ needs.build.outputs.tag }}
          cache-from: type=gha
      - name: Summary
        run: |
          echo "### Image published" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.docker_meta.outputs.tags }}" | sed 's/^/- `/; s/$/`/' >> $GITHUB_STEP_SUMMARY

  # ---------- Stage 4: deploy to server over SSH ----------
  deploy:
    name: Deploy to server
    needs: [build, publish]
    # Enable by setting repository variable DEPLOY_ENABLED=true once your server is ready
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts
      - name: Copy deployment files
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "mkdir -p ~/task-tracker"
          scp -r docker-compose.yml scripts ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:~/task-tracker/
      - name: Deploy (health check + auto rollback)
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "cd ~/task-tracker && IMAGE=${{ env.IMAGE_NAME }}:${{ needs.build.outputs.tag }} ./scripts/deploy.sh"
      - name: Verify deployment from outside
        run: ./scripts/smoke-test.sh "http://${{ secrets.SERVER_HOST }}"
      - name: Deployment summary
        run: |
          echo "### Deployed" >> $GITHUB_STEP_SUMMARY
          echo "- Image: \`${{ env.IMAGE_NAME }}:${{ needs.build.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- URL: http://${{ secrets.SERVER_HOST }}" >> $GITHUB_STEP_SUMMARY
